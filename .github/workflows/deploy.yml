name: Build and publish Ganza

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/deploy.yml'
  pull_request:
    paths:
      - 'app/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm test
        working-directory: app
      - name: Build
        run: npm run build
        working-directory: app
        env:
          BASE_PATH: /GANZA/

      # Publishing twice, on purpose.
      #
      # GitHub Pages can be served either from a workflow or from a branch, and
      # which one a repository uses is a setting, not something this file can see.
      # Serving from a branch runs Jekyll, and Jekyll turns README.md into the home
      # page — which is what happened here. Rather than depend on that setting
      # being right, the built app is committed to the repository root as well, so
      # the site works whichever way Pages is pointed.
      #
      # The root copy is regenerated here on every push, so it cannot drift from
      # the source in app/. This push touches no path in the `paths:` filter above,
      # so it does not retrigger this workflow.
      - name: Update the copy served from the repository root
        if: github.ref == 'refs/heads/main'
        run: |
          rm -rf assets icons index.html 404.html manifest.webmanifest sw.js workbox-*.js registerSW.js favicon.svg
          cp -r app/dist/. .
          touch .nojekyll
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Rebuild the published app from app/"
            git push
          else
            echo "Root copy already matches the build."
          fi

      # `enablement: true` points Pages at this workflow. Once that has taken
      # effect the root copy above is simply ignored, and Jekyll stops running.
      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main'
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: app/dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
