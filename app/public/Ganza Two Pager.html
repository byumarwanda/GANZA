document.addEventListener('DOMContentLoaded', async function() {

  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';

      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));

    // events at the element — warn only; real JS errors carry message/error.

      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;

    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));

    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque

      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&

            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {

        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();

            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;

            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }

            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }

          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);

        }

        console.error('Failed to decode asset ' + uuid + ':', err);

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {

    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

idden;font-family:'Figtree',system-ui,sans-serif;font-size:12px;line-height:1.5;letter-spacing:-0.002em\">\n\n  <div style=\"display:flex;align-items:flex-end;justify-content:space-between;gap:24px;padding-bottom:12px;border-bottom:1.5px solid #241F1A\">\n    <div style=\"display:flex;align-items:center;gap:14px\">\n      <svg width=\"44\" height=\"48\" sc-camel-view-box=\"60 40 440 480\" style=\"flex:none\" aria-hidden=\"true\"><path d=\"M 280 69 L 420 279 L 140 279 Z\" fill=\"#5A55D6\"><\u002Fpath><path d=\"M 128 303 L 432 303 L 376 491 L 184 491 Z\" fill=\"#5A55D6\"><\u002Fpath><path d=\"M 172 401 L 208 365 L 244 401 L 280 365 L 316 401 L 352 365 L 388 401\" fill=\"none\" stroke=\"#D69A2D\" stroke-width=\"22\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n      <div>\n        <div style=\"font-family:'Archivo',sans-serif;font-size:31px;font-weight:700;letter-spacing:-.035em;line-height:1\">Ganza<\u002Fdiv>\n        <div style=\"font-size:12px;color:#6E6357;margin-top:3px;white-space:nowrap\">The ikimina logbook. Not a wallet.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"text-align:right;font-size:10.5px;color:#6E6357;line-height:1.55\">\n      <div style=\"font-weight:600;color:#241F1A\">FinTech Innovation Hackathon 2026<\u002Fdiv>\n      <div>Strengthening savings mobilisation and financial resilience<\u002Fdiv>\n      <div style=\"font-family:'Archivo',sans-serif;font-weight:600;color:#8F4620;font-size:12px;margin-top:2px\">*384*48293#<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"font-family:'Archivo',sans-serif;font-size:17px;line-height:1.45;font-weight:500;letter-spacing:-.02em;margin-top:22px;max-width:660px;text-wrap:pretty\">Rwanda's ibimina already work. Ganza does not replace the group, the meeting, or the money — it makes the record official, so that years of saving can finally count for something outside the room.<\u002Fdiv>\n\n  <div style=\"display:flex;align-items:center;gap:10px;margin-top:36px\">\n    <span style=\"font-family:'Archivo',sans-serif;font-size:10px;font-weight:600;color:#4B45C0;letter-spacing:.18em\">01<\u002Fspan>\n    <span style=\"font-size:10px;font-weight:600;color:#6E6357;letter-spacing:.18em;text-transform:uppercase\">Problem statement<\u002Fspan>\n    <span style=\"flex:1;height:1px;background:rgba(36,31,26,.13)\"><\u002Fspan>\n  <\u002Fdiv>\n  <div style=\"font-family:'Archivo',sans-serif;font-size:21.5px;font-weight:600;letter-spacing:-.028em;line-height:1.22;margin-top:11px;color:#8F4620\">The trust is already there. The record is what fails — and it dies with the group.<\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-top:18px\">\n    <div style=\"background:#FFFFFF;border:1px solid rgba(36,31,26,.11);border-radius:10px;padding:17px 17px\">\n      <div style=\"font-family:'Archivo',sans-serif;font-size:29px;font-weight:700;letter-spacing:-.035em;line-height:1;color:#A8542B\">52%<\u002Fdiv>\n      <div style=\"font-size:12px;color:#4A4239;line-height:1.45;margin-top:9px\">of adults save through an ikimina or VSLA — around 4 million people.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#3A2A1E;border:1px solid #3A2A1E;border-radius:10px;padding:17px 17px;color:#FFFFFF\">\n      <div style=\"font-family:'Archivo',sans-serif;font-size:29px;font-weight:700;letter-spacing:-.035em;line-height:1\">3%<\u002Fdiv>\n      <div style=\"font-size:12px;line-height:1.45;margin-top:9px;color:#FFFFFF\">of loans asked for inside a group are refused. <span style=\"color:#F2C46B;font-weight:700\">Trust, measured.<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#FFFFFF;border:1px solid rgba(36,31,26,.11);border-radius:10px;padding:17px 17px\">\n      <div style=\"font-family:'Archivo',sans-serif;font-size:29px;font-weight:700;letter-spacing:-.035em;line-height:1;color:#7A3E1E\">86%<\u002Fdiv>\n      <div style=\"font-size:12px;color:#4A4239;line-height:1.45;margin-top:9px\">of those loans are repaid in cash, so the repayment leaves no trace at all.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#FFFFFF;border:1px solid rgba(36,31,26,.11);border-radius:10px;padding:17px 17px\">\n      <div style=\"font-family:'Archivo',sans-serif;font-size:29px;font-weight:700;letter-spacing:-.035em;line-height:1;color:#6E3A1C\">9–12<\u002Fdiv>\n      <div style=\"font-size:12px;color:#4A4239;line-height:1.45;margin-top:9px\">months, then the group shares out and closes. The notebook ends with it.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"font-size:10.5px;color:#6E6357;margin-top:9px\">FinScope 2024 · NISR / Access to Finance Rwanda · field interviews, Kigali, July 2026<\u002Fdiv>\n\n  <sc-if value=\"{{ showVoices }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-top:22px\">\n      <div style=\"border-left:2px solid #D69A2D;padding:2px 0 2px 12px\">\n        <div style=\"font-size:12.5px;font-weight:500;line-height:1.48;text-wrap:pretty\">“Sometimes the person writing can make a mistake and record less.”<\u002Fdiv>\n        <div style=\"font-size:10.5px;color:#6E6357;margin-top:5px\">Member — asked if she had ever worried about her money<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border-left:2px solid #D69A2D;padding:2px 0 2px 12px\">\n        <div style=\"font-size:12.5px;font-weight:500;line-height:1.48;text-wrap:pretty\">“You have to call them, or look at what you wrote down yourself, or wait for the day we meet.”<\u002Fdiv>\n        <div style=\"font-size:10.5px;color:#6E6357;margin-top:5px\">Member — asked how she checks the group's balance<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border-left:2px solid #D69A2D;padding:2px 0 2px 12px\">\n        <div style=\"font-size:12.5px;font-weight:500;line-height:1.48;text-wrap:pretty\">“Kubika amakuru neza.” <span style=\"color:#6E6357;font-weight:400\">— Keeping the records properly.<\u002Fspan><\u002Fdiv>\n        <div style=\"font-size:10.5px;color:#6E6357;margin-top:5px\">Ikimina leader — asked for the hardest part of the job<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <div style=\"display:flex;align-items:center;gap:10px;margin-top:28px\">\n    <span style=\"font-family:'Archivo',sans-serif;font-size:10px;font-weight:600;color:#4B45C0;letter-spacing:.18em\">02<\u002Fspan>\n    <span style=\"font-size:10px;font-weight:600;color:#6E6357;letter-spacing:.18em;text-transform:uppercase\">Proposed solution<\u002Fspan>\n    <span style=\"flex:1;height:1px;background:rgba(36,31,26,.13)\"><\u002Fspan>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;gap:14px;margin-top:16px;align-items:stretch\">\n    <div style=\"flex:1.15;background:#241F1A;color:#FAF6F0;border-radius:12px;padding:25px 24px 24px;position:relative;overflow:hidden;display:flex;flex-direction:column\">\n      <sc-if value=\"{{ showPattern }}\" hint-placeholder-val=\"{{ true }}\">\n        <svg width=\"250\" height=\"44\" sc-camel-view-box=\"0 0 250 44\" style=\"position:absolute;right:-10px;bottom:-6px;opacity:.3;pointer-events:none\" aria-hidden=\"true\"><path d=\"M8 36 L38 9 L68 36 L98 9 L128 36 L158 9 L188 36 L218 9 L242 30\" fill=\"none\" stroke=\"#D69A2D\" stroke-width=\"10\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n      <\u002Fsc-if>\n      <div style=\"font-family:'Archivo',sans-serif;font-size:24px;font-weight:600;letter-spacing:-.032em;line-height:1.18;position:relative\">A logbook, not a wallet.<\u002Fdiv>\n      <div style=\"font-size:12.5px;color:rgba(250,246,240,.8);line-height:1.55;margin-top:11px;position:relative;max-width:330px\">Ganza never holds a franc. The group keeps the bank, SACCO, Mobile Money or cash it already uses. There is nothing to hand over, so there is nothing to fear — a group can start at its next meeting.<\u002Fdiv>\n      <div style=\"font-size:12.5px;color:rgba(250,246,240,.8);line-height:1.55;margin-top:9px;position:relative;max-width:330px\">We are not taking the power out of people's hands. We are giving them a way to use it that others can finally read.<\u002Fdiv>\n      <div style=\"margin-top:16px;position:relative;font-size:11.5px;font-weight:600;color:#F2C46B;letter-spacing:.02em\">Any phone · USSD first · Kinyarwanda &amp; English · no data needed<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"flex:1;display:flex;flex-direction:column;gap:14px\">\n      <div style=\"background:#FFFFFF;border:1px solid rgba(36,31,26,.11);border-radius:12px;padding:18px 20px\">\n        <div style=\"font-size:10px;font-weight:600;color:#6E3A1C;letter-spacing:.14em;text-transform:uppercase\">Stays exactly as it is<\u002Fdiv>\n        <div style=\"font-size:12.5px;line-height:1.55;margin-top:8px;color:#3D372F\">The meeting. The cash in hand. The treasurer, president and secretary. Who may borrow, and on what terms. The group decides — Ganza only writes it down.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#FFFFFF;border:1px solid rgba(36,31,26,.11);border-radius:12px;padding:18px 20px\">\n        <div style=\"font-size:10px;font-weight:600;color:#8F4620;letter-spacing:.14em;text-transform:uppercase\">What Ganza adds<\u002Fdiv>\n        <div style=\"font-size:12.5px;line-height:1.55;margin-top:8px;color:#3D372F\">An entry at the moment money changes hands. An SMS receipt to the payer. A second leader who checks before it is final. A total nobody has to add up — and a history that survives the share-out.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;justify-content:space-between;align-items:center;font-size:10px;color:#6E6357;padding-top:10px;margin-top:auto;border-top:1px solid rgba(36,31,26,.12)\">\n    <span>Ganza · Umutekano w'ikimina<\u002Fspan><span>Page 1 of 2<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\" data-screen-label=\"Page 2\" style=\"background:linear-gradient(158deg,#F2EEE5 0%,#EFEAE7 46%,#E9E5EF 100%);color:#241F1A;padding:15mm 16mm 12mm;display:flex;flex-direction:column;position:relative;overflow:hidden;font-family:'Figtree',system-ui,sans-serif;font-size:12px;line-height:1.5;letter-spacing:-0.002em\">\n\n  <div style=\"display:flex;align-items:center;gap:10px\">\n    <span style=\"font-family:'Archivo',sans-serif;font-size:10px;font-weight:600;color:#4B45C0;letter-spacing:.18em\">03<\u002Fspan>\n    <span style=\"font-size:10px;font-weight:600;color:#6E6357;letter-spacing:.18em;text-transform:uppercase\">Solution architecture<\u002Fspan>\n    <span style=\"flex:1;height:1px;background:rgba(36,31,26,.13)\"><\u002Fspan>\n  <\u002Fdiv>\n  <div style=\"font-family:'Archivo',sans-serif;font-size:18px;font-weight:600;letter-spacing:-.028em;line-height:1.24;margin-top:9px;color:#8F4620\">One person writes it. Another checks it. The money never passes through us.<\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:13px\">\n    <div style=\"background:#FFFFFF;border:1px solid rgba(36,31,26,.11);border-radius:9px;padding:12px 11px 13px;display:flex;flex-direction:column;min-height:64px\">\n      <div style=\"font-size:8px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:#6E6357\">Member<\u002Fdiv>\n      <div style=\"font-size:11px;font-weight:600;line-height:1.3;margin-top:auto\">Pays at the meeting<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#FFFFFF;border:1px solid rgba(36,31,26,.11);border-radius:9px;padding:12px 11px 13px;display:flex;flex-direction:column;min-height:64px\">\n      <div style=\"font-size:8px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:#6E6357\">Treasurer<\u002Fdiv>\n      <div style=\"font-size:11px;font-weight:600;line-height:1.3;margin-top:auto\">Types ID + amount<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#3A2A1E;color:#FFFFFF;border-radius:9px;padding:12px 11px 13px;display:flex;flex-direction:column;min-height:64px\">\n      <div style=\"font-size:8px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:#F2C46B\">Ganza<\u002Fdiv>\n      <div style=\"font-size:11px;font-weight:600;line-height:1.3;margin-top:auto\">Balance + SMS receipt<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#FFFFFF;border:1px solid rgba(36,31,26,.11);border-radius:9px;padding:12px 11px 13px;display:flex;flex-direction:column;min-height:64px\">\n      <div style=\"font-size:8px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:#6E6357\">Meeting<\u002Fdiv>\n      <div style=\"font-size:11px;font-weight:600;line-height:1.3;margin-top:auto\">Expenses in, net calculated<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#FFFFFF;border:1px solid rgba(36,31,26,.11);border-radius:9px;padding:12px 11px 13px;display:flex;flex-direction:column;min-height:64px\">\n      <div style=\"font-size:8px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:#6E6357\">Treasurer<\u002Fdiv>\n      <div style=\"font-size:11px;font-weight:600;line-height:1.3;margin-top:auto\">Banks it the group's usual way<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#241F1A;color:#FAF6F0;border-radius:9px;padding:12px 11px 13px;display:flex;flex-direction:column;min-height:64px\">\n      <div style=\"font-size:8px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:#F2C46B\">Leader<\u002Fdiv>\n      <div style=\"font-size:11px;font-weight:600;line-height:1.3;margin-top:auto\">Approves. Now it is final.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;gap:12px;margin-top:12px\">\n    <div style=\"flex:1;background:#FFFFFF;border:1px solid rgba(36,31,26,.11);border-radius:11px;padding:12px 15px\">\n      <div style=\"font-size:9.5px;font-weight:600;color:#6E6357;letter-spacing:.14em;text-transform:uppercase\">The phone number decides the menu<\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:5px;margin-top:8px\">\n        <div style=\"display:flex;gap:10px;font-size:11px\"><span style=\"flex:none;width:112px;font-weight:600\">Treasurer<\u002Fspan><span style=\"color:#574E44;line-height:1.35\">Collect · expenses · deposit · loans<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;gap:10px;font-size:11px\"><span style=\"flex:none;width:112px;font-weight:600\">President / Secretary<\u002Fspan><span style=\"color:#574E44;line-height:1.35\">Approve · report · members · stand in<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;gap:10px;font-size:11px\"><span style=\"flex:none;width:112px;font-weight:600\">Member<\u002Fspan><span style=\"color:#574E44;line-height:1.35\">Own savings · own loan · own history<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-size:10.5px;color:#574E44;line-height:1.45;margin-top:10px;padding-top:9px;border-top:1px solid rgba(36,31,26,.1)\">Nobody approves their own entry — not even a leader standing in for an absent treasurer.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex:1;background:#FFFFFF;border:1px solid rgba(36,31,26,.11);border-radius:11px;padding:12px 15px\">\n      <div style=\"font-size:9.5px;font-weight:600;color:#6E6357;letter-spacing:.14em;text-transform:uppercase\">Stack<\u002Fdiv>\n      <div style=\"font-family:'Archivo',sans-serif;font-size:11.5px;font-weight:500;line-height:1.5;margin-top:8px\">USSD gateway → session service → ledger database → SMS receipts<\u002Fdiv>\n      <div style=\"font-size:10.5px;color:#574E44;line-height:1.45;margin-top:8px\">Every entry is written the moment it is typed, so a dropped session never loses a contribution. Working prototype today; production service and a dedicated RURA short code next.<\u002Fdiv>\n      <div style=\"font-size:10.5px;color:#574E44;line-height:1.45;margin-top:8px;padding-top:8px;border-top:1px solid rgba(36,31,26,.1)\"><span style=\"font-weight:600;color:#241F1A\">There is a smartphone app too<\u002Fspan> — the same features, nothing extra. Everything in it can be done on USSD, so no member is ever a second-class member.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"background:#FFFFFF;border:1px solid rgba(36,31,26,.11);border-left:3px solid #B5641A;border-radius:11px;padding:11px 15px;margin-top:10px\">\n    <div style=\"font-size:9.5px;font-weight:600;color:#8F4620;letter-spacing:.14em;text-transform:uppercase\">Cash first, on purpose<\u002Fdiv>\n    <div style=\"font-size:12px;color:#3D372F;line-height:1.5;margin-top:6px\">The money still moves the way the group already moves it — hand to hand at the meeting. Changing that on day one would catch people off guard. Once the record is trusted, eKash and integrations with banks, SACCOs and mobile money can reconcile deposits automatically, at the group's own pace. Later, and deliberately.<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;align-items:center;gap:10px;margin-top:12px\">\n    <span style=\"font-family:'Archivo',sans-serif;font-size:10px;font-weight:600;color:#4B45C0;letter-spacing:.18em\">04<\u002Fspan>\n    <span style=\"font-size:10px;font-weight:600;color:#6E6357;letter-spacing:.18em;text-transform:uppercase\">Adoption strategy<\u002Fspan>\n    <span style=\"flex:1;height:1px;background:rgba(36,31,26,.13)\"><\u002Fspan>\n  <\u002Fdiv>\n  <div style=\"font-family:'Archivo',sans-serif;font-size:18px;font-weight:600;letter-spacing:-.028em;line-height:1.24;margin-top:9px;color:#8F4620\">Start where the trust already is. Earn the right to make it count.<\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-top:12px\">\n    <div style=\"background:#FFFFFF;border:1px solid rgba(36,31,26,.11);border-radius:11px;padding:11px 14px;border-top:3px solid #A8542B\">\n      <div style=\"font-family:'Archivo',sans-serif;font-size:10px;font-weight:600;color:#8F4620;letter-spacing:.14em\">PHASE 01<\u002Fdiv>\n      <div style=\"font-family:'Archivo',sans-serif;font-size:12.5px;font-weight:600;letter-spacing:-.018em;margin-top:5px\">Make the meeting easier<\u002Fdiv>\n      <div style=\"font-size:11.5px;color:#574E44;line-height:1.45;margin-top:6px\">Pilot with Kigali ibimina. The treasurer keeps her notebook alongside for one full cycle — Ganza has to prove itself against the book, not replace it by decree.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#FFFFFF;border:1px solid rgba(36,31,26,.11);border-radius:11px;padding:11px 14px;border-top:3px solid #4B45C0\">\n      <div style=\"font-family:'Archivo',sans-serif;font-size:10px;font-weight:600;color:#4B45C0;letter-spacing:.14em\">PHASE 02<\u002Fdiv>\n      <div style=\"font-family:'Archivo',sans-serif;font-size:12.5px;font-weight:600;letter-spacing:-.018em;margin-top:5px\">Make the ikimina official<\u002Fdiv>\n      <div style=\"font-size:11.5px;color:#574E44;line-height:1.45;margin-top:6px\">A verified record of saving and repayment in the member's own name, in her own hands — one that outlives the group when it shares out and dissolves.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#FFFFFF;border:1px solid rgba(36,31,26,.11);border-radius:11px;padding:11px 14px;border-top:3px solid #241F1A\">\n      <div style=\"font-family:'Archivo',sans-serif;font-size:10px;font-weight:600;color:#241F1A;letter-spacing:.14em\">PHASE 03<\u002Fdiv>\n      <div style=\"font-family:'Archivo',sans-serif;font-size:12.5px;font-weight:600;letter-spacing:-.018em;margin-top:5px\">Make it open a door<\u002Fdiv>\n      <div style=\"font-size:11.5px;color:#574E44;line-height:1.45;margin-top:6px\">With her consent, that history reaches a lender. Rwandan law already allows a licensed provider to report it — nobody serving ibimina has done it yet.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;gap:12px;margin-top:12px\">\n    <div style=\"flex:1.3;background:#241F1A;color:#FFFFFF;border-radius:12px;padding:19px 20px 22px;position:relative;overflow:hidden;min-height:178px\">\n      <div style=\"font-size:9.5px;font-weight:600;color:#F2C46B;letter-spacing:.14em;text-transform:uppercase\">Value to BNR and the sector<\u002Fdiv>\n      <div style=\"font-family:'Archivo',sans-serif;font-size:13px;font-weight:600;letter-spacing:-.022em;line-height:1.35;margin-top:6px\">The informal half of the savings economy has never been visible. This is how it becomes visible — without exposing a single member.<\u002Fdiv>\n      <div style=\"font-size:11.5px;color:rgba(255,255,255,.9);line-height:1.5;margin-top:7px\">Aggregated and anonymised, ibimina behaviour becomes live evidence on savings mobilisation, repayment and the credit gap — the alternative credit data that FSDS 2025–2030 and the National FinTech Strategy 2024–2029 both call for.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex:1;background:#FFFFFF;border:1px solid rgba(36,31,26,.11);border-radius:12px;padding:19px 20px 22px;display:flex;flex-direction:column;min-height:178px\">\n      <div style=\"font-size:9.5px;font-weight:600;color:#6E6357;letter-spacing:.14em;text-transform:uppercase\">Business model<\u002Fdiv>\n      <div style=\"font-family:'Archivo',sans-serif;font-size:13px;font-weight:600;letter-spacing:-.022em;line-height:1.35;margin-top:6px\">A flat fee per member. Never a cut of anyone's savings.<\u002Fdiv>\n      <sc-if value=\"{{ showVoices }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"border-left:2px solid #D69A2D;padding:2px 0 2px 11px;margin-top:auto\">\n          <div style=\"font-size:11.5px;font-weight:500;line-height:1.45;text-wrap:pretty\">“If it works properly and it is recognised by law, we would use it.”<\u002Fdiv>\n          <div style=\"font-size:10.5px;color:#6E6357;margin-top:4px\">Member — asked what would make her trust a phone tool for the group's money<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"margin-top:auto;padding-top:8px\">\n    <div style=\"display:flex;align-items:center;gap:15px;border-top:1.5px solid #241F1A;padding-top:10px\">\n      <svg width=\"32\" height=\"35\" sc-camel-view-box=\"60 40 440 480\" style=\"flex:none\" aria-hidden=\"true\"><path d=\"M 280 69 L 420 279 L 140 279 Z\" fill=\"#5A55D6\"><\u002Fpath><path d=\"M 128 303 L 432 303 L 376 491 L 184 491 Z\" fill=\"#5A55D6\"><\u002Fpath><path d=\"M 172 401 L 208 365 L 244 401 L 280 365 L 316 401 L 352 365 L 388 401\" fill=\"none\" stroke=\"#D69A2D\" stroke-width=\"22\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n      <div style=\"flex:1;min-width:0\">\n        <div style=\"font-family:'Archivo',sans-serif;font-size:14.5px;font-weight:600;letter-spacing:-.024em;line-height:1.42;text-wrap:pretty\">We are not asking anyone to move their money. We are making the place they already trust easier to write down, easier to check — and finally worth something outside the room.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:none;text-align:right;font-size:10px;color:#6E6357;line-height:1.5\">\n        <div style=\"font-family:'Archivo',sans-serif;font-size:12px;font-weight:600;color:#8F4620\">*384*48293#<\u002Fdiv>\n        <div>Page 2 of 2<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fx-import>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;paperSize&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;a4&quot;,&quot;letter&quot;],&quot;default&quot;:&quot;a4&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Print&quot;},&quot;showPattern&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Style&quot;},&quot;showVoices&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Content&quot;}}\">\nclass Component extends DCLogic {\n  componentDidMount() {\n    this._syncPageBox();\n  }\n  componentDidUpdate() {\n    this._syncPageBox();\n  }\n  /* <x-import> slots the .page sections in after doc-page has already run its\n     measure pass, so the component never flips into paginated mode on its own.\n     Nudge it until it does — without this the pages lay out content-tall and\n     print geometry (one A4 sheet per page) never engages. */\n  _syncPageBox(tries) {\n    const n = tries || 0;\n    if (n > 40) return;\n    customElements.whenDefined('doc-page').then(() => {\n      const dp = document.querySelector('doc-page');\n      const ready = dp && dp.querySelector(':scope > .page');\n      if (ready && typeof dp._measure === 'function') {\n        dp._measure();\n        const sheet = dp.shadowRoot && dp.shadowRoot.querySelector('.sheet');\n        if (sheet && sheet.classList.contains('paginated')) return;\n      }\n      setTimeout(() => this._syncPageBox(n + 1), 60);\n    });\n  }\n  renderVals() {\n    return {\n      paperSize: this.props.paperSize ?? 'a4',\n      showPattern: this.props.showPattern ?? true,\n      showVoices: this.props.showVoices ?? true\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
</body>
</html>
